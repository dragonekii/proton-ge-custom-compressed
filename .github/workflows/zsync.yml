name: zsync

on:
  push:
    tags:
      - 'GE-Proton*' # triggers the workflow for any tag pushed

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:

  zsync:

    runs-on: ubuntu-latest

    steps:
      - name: Install zsync
        run: sudo apt-get update && sudo apt-get install -y zsync

      - name: Download proton-ge-custom latest release
        uses: robinraju/release-downloader@v1
        with:
          repository: GloriousEggroll/proton-ge-custom
          latest: true
          fileName: 'GE-Proton*.tar.gz'
          
      - uses: robinraju/release-downloader@v1
        with:
          repository: GloriousEggroll/proton-ge-custom
          latest: true
          fileName: 'GE-Proton*.sha512sum'

      - name: preparation
        run: |
          mv GE-Proton*.sha512sum SHA512SUMS
          grep "GE-Proton.*\.tar\.gz$" SHA512SUMS | sha512sum -c
          
          VER=$(basename GE-Proton*.tar.gz .tar.gz)
          echo "VER=${VER}" >> "$GITHUB_ENV"
          
          mv GE-Proton*.tar.gz proton.tar.gz
          gzip -d proton.tar.gz

      - name: zsync
        run: |
          UPSTREAM_URL="https://github.com/GloriousEggroll/proton-ge-custom/releases/download/${{ env.VER }}/${{ env.VER }}.tar.gz"
          
          zsyncmake -z -u "${UPSTREAM_URL}" proton.tar
          
          mv proton.tar.gz "${{ env.VER }}.tar.gz"
          mv proton.tar.zsync "${{ env.VER }}.tar.gz.zsync"
          
          rm -f SHA512SUMS
          sha512sum "${{ env.VER }}.tar.gz.zsync" > SHA512SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.VER }}.zsync
          path: ${{ github.workspace }}/${{ env.VER }}.tar.gz.zsync

      - name: release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ github.workspace }}/${{ env.VER }}.tar.gz.zsync
            ${{ github.workspace }}/SHA512SUMS
          generate_release_notes: false
