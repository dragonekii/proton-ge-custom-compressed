name: zsync

on:
  push:
    tags:
      - 'GE-Proton*' # triggers the workflow for any tag pushed

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:

  zsync:

    runs-on: ubuntu-latest

    
    steps:
      - name: Download proton-ge-custom latest release
        uses: robinraju/release-downloader@v1
        with:
          repository: GloriousEggroll/proton-ge-custom
          latest: true
          fileName: 'GE-Proton*.tar.gz'
          
      - uses: robinraju/release-downloader@v1
        with:
          repository: GloriousEggroll/proton-ge-custom
          latest: true
          fileName: 'GE-Proton*.sha512sum'

      - name: preparation
        run: |
          mv GE-Proton*.sha512sum SHA512SUMS
          grep "GE-Proton.*\.tar\.gz$" SHA512SUMS | sha512sum -c
          VER=$(basename GE-Proton*.tar.gz .tar.gz)
          echo "VER=${VER}" >> "$GITHUB_ENV"
          mv GE-Proton*.tar.gz proton.tar.gz
          gzip -d proton.tar.gz

      - name: zsync
        run: |
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${VER}.tar.gz"
          zsyncmake -z -u ${RELEASE_URL} proton.tar
          
          mv proton.tar.gz "${VER}.tar.gz"
          mv proton.tar.zsync "${VER}.tar.gz.zsync"
          
          rm -rf SHA512SUMS
          sha512sum "${VER}.tar.gz" "${VER}.zsync" >> SHA512SUMS
          
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.VER }}.tar.gz
          path: ${{ github.workspace }}/${{ env.VER }}.tar.gz

      - name: release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ github.workspace }}/${{ env.VER }}.tar.gz
            ${{ github.workspace }}/${{ env.VER }}.zsync
            ${{ github.workspace }}/SHA512SUMS
          generate_release_notes: false
